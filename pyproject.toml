[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-bank-import"
version = "0.1.0"
description = "Обработка выписок Т-Банка, Альфа-Банка и СберБизнес по правилам проекта"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
google = ["google-api-python-client>=2.140", "google-auth>=2.30"]

[project.scripts]
bank-import = "bank_import.__main__:main"

[tool.setuptools.packages.find]
include = ["bank_import*"]
